name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# IDLC v6 Rule 7: actions pineadas a SHA inmutable. El comentario
# `# vX.Y.Z` es informativo — el lock real es el hash. Para actualizar:
# `gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq .object.sha`.

jobs:
  lint:
    name: Lint y calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: ShellCheck — análisis estático de scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: warning
          scandir: '.'
          additional_files: '*.sh tests/*.sh'

      - name: Verificar que no hay claves privadas en el código
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: detect-private-key --all-files

      - name: gitleaks — detección de secrets
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: gitleaks --all-files

  test:
    name: Tests de verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # REQ-NET-31/33: el unit test de pytest (08-monitor.py) DEBE correr en
      # CI (gate §7.3 unit tests + coverage). En runner GitHub-hosted las deps
      # se instalan en el workflow (un único paso de orquestación).
      # Versiones pinneadas en requirements-dev.txt (R7).
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test Python
        run: pip install -r requirements-dev.txt

      - name: Verificar sintaxis de todos los scripts bash
        run: ./tests/check_bash_syntax.sh

      - name: Verificar que config/env.example tiene todas las variables requeridas
        run: ./tests/check_env_example.sh

      - name: Verificar que los archivos obligatorios IDLC existen
        run: ./tests/check_idlc_files.sh

      - name: Verificar que .gitignore excluye archivos sensibles
        run: ./tests/check_gitignore_sensitive.sh

      - name: Compilar y ejecutar test unitario C (REQ-NET-12 dedup LRU)
        run: |
          # El test C standalone tests/unit/test_replicate_dedup.c valida
          # la lógica del dedup circular (1024 entries) sin compilar
          # ubond entero. CONDICIONAL: solo existe en feat/ubond-evaluation
          # mientras v2 esté en branch separada. En main aún no está → skip.
          if [ ! -f ./tests/test_REQ-NET-12_unit_dedup.sh ]; then
            echo "Skipping: test C unitario solo existe en feat/ubond-evaluation por ahora"
            exit 0
          fi
          if ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
            echo "ERROR: ni gcc ni clang disponibles en runner"
            exit 1
          fi
          ./tests/test_REQ-NET-12_unit_dedup.sh

      - name: Ejecutar suite verificar-setup (incluye trazabilidad IDLC v6)
        run: ./tests/verificar-setup.sh

      - name: Publicar reportes JUnit XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-reports
          path: reports/
          if-no-files-found: warn
