repos:
  # Checks básicos: ficheros sin terminar, BOM, espacios en blanco
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Los .patch deben preservarse byte a byte: un diff con espacios de
        # contexto significativos deja de aplicar si se le quita whitespace.
        exclude: '\.patch$'
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # ShellCheck — análisis estático de scripts bash
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: '\.(sh)$'

  # gitleaks — detección de secrets en código (defensa en profundidad).
  # Complementa detect-private-key (que solo cubre SSH/PGP) con tokens,
  # API keys, AWS/GCP creds y patrones similares.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # markdownlint — linting de docs (IDLC v6 Rule 8: comprehensive
  # docs linting). Config en .markdownlint.yml.
  # Pin a v0.43.0: versiones >=0.44.0 actualizan transitiva de eslint
  # que exige Node 20.19+/22.13+/24+. Mientras Jorge use Node 21.x,
  # v0.43.0 es la última compatible.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ['--ignore', 'build/', '--ignore', 'node_modules/']

  # ruff — linting Python (IDLC v6 Rule 8). Cubre 08-monitor.py
  # (582 LOC). Reemplaza flake8 + pyflakes + pycodestyle (más rápido,
  # menos deps). Configuración en pyproject.toml o ruff.toml si
  # necesitamos override; por defecto razonable para Lane 1.
  # Excluye build/ (ubond upstream) y __pycache__/.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ['--exclude', 'build/', '--exclude', '__pycache__/']

  # pytest + coverage — REQ-NET-33 Fase 1 (Python coverage gating).
  # Hook local porque pytest necesita el entorno del usuario con
  # las deps instaladas. cov-fail-under=40 inicial conservador
  # (cobertura real medida 48% — margen para refactors menores).
  # Elevar el threshold cuando se estabilice cobertura.
  - repo: local
    hooks:
      - id: pytest-monitor-coverage
        name: pytest 08-monitor.py with coverage (REQ-NET-33 P1)
        entry: pytest tests/test_req_net_31_monitor.py --cov=ave_monitor --cov-fail-under=40 -q
        language: system
        pass_filenames: false
        files: ^(08-monitor\.py|tests/test_req_net_31_monitor\.py)$
