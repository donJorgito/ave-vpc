repos:
  # Checks básicos: ficheros sin terminar, BOM, espacios en blanco
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # ShellCheck — análisis estático de scripts bash
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: '\.(sh)$'

  # gitleaks — detección de secrets en código (defensa en profundidad).
  # Complementa detect-private-key (que solo cubre SSH/PGP) con tokens,
  # API keys, AWS/GCP creds y patrones similares.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Terraform — fmt, validate y tflint (IDLC v6 Rule 8: IaC linting).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
